<app-map-3d
  [camera]="camera()"
  [markers]="markers()"
  (markerClick)="openHotelPopover($event.marker, $event.markerView.hotel)"
>
  <ng-template>
    <gmp-popover #hotelPopover id="hotelPopover">
      @if (popoverHotel(); as hotel) {
        <app-hotel-info-window [hotel]="hotel" (closed)="closePopover()"> </app-hotel-info-window>
      }
    </gmp-popover>
  </ng-template>
</app-map-3d>
