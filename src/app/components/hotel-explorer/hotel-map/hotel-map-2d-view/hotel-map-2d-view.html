<app-map-2d
  [markers]="markers()"
  (mapReady)="handleMapReady($event)"
  (markerClick)="openHotelInfoWindow($event.marker, $event.markerView.hotel)"
>
  <ng-template>
    <map-info-window
      #hotelInfoWindow="mapInfoWindow"
      [options]="{ headerDisabled: true, maxWidth: 260 }"
      (closeclick)="clearHotelInfoWindow()"
    >
      @if (infoWindowHotel(); as hotel) {
        <app-hotel-info-window [hotel]="hotel" (closed)="closeHotelInfoWindow()">
        </app-hotel-info-window>
      }
    </map-info-window>
  </ng-template>
</app-map-2d>
