<app-map-2d (mapReady)="handleMapReady($event)">
  <ng-template>
    <map-info-window
      #hotelInfoWindow="mapInfoWindow"
      [options]="{ headerDisabled: true, maxWidth: 260 }"
      (closeclick)="clearHotelInfoWindow()"
    >
      @if (infoWindowHotel(); as hotel) {
        <app-hotel-info-window
          [hotel]="hotel"
          (detailsRequested)="requestHotelDetails(hotel)"
          (closed)="closeHotelInfoWindow()"
        >
        </app-hotel-info-window>
      }
    </map-info-window>

    @for (markerView of markers(); track markerView.id) {
      <map-advanced-marker
        #marker="mapAdvancedMarker"
        [position]="markerView.position2d"
        [content]="markerView.content"
        [title]="markerView.title"
        [gmpClickable]="true"
        (gmpClick)="openHotelInfoWindow(marker, markerView.hotel)"
      ></map-advanced-marker>
    }
  </ng-template>
</app-map-2d>
