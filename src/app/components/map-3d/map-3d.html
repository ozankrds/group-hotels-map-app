@if (apiLoaded()) {
  <gmp-map-3d
    #map3d
    class="map-3d"
    [attr.center]="centerAttribute()"
    [attr.heading]="camera().heading"
    [attr.map-id]="mapId"
    [attr.mode]="mode()"
    [attr.range]="camera().range"
    [attr.tilt]="camera().tilt"
  >
    @if (contentTemplate; as template) {
      <ng-container [ngTemplateOutlet]="template"></ng-container>
    }

    @for (markerView of markers(); track markerView.id) {
      <gmp-marker-3d-interactive
        altitude-mode="CLAMP_TO_GROUND"
        collision-behavior="REQUIRED"
        [attr.position]="markerView.position3d"
        [attr.title]="markerView.title"
        (gmpClick)="handleMarkerClick($event, markerView)"
      ></gmp-marker-3d-interactive>
    }
  </gmp-map-3d>
} @else if (apiLoadError()) {
  <div class="loading-message">
    {{ apiLoadError() }}
  </div>
} @else {
  <div class="loading-message">3D harita yukleniyor, lutfen bekleyin...</div>
}
